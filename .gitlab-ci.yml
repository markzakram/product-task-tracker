# =============================================================================
#  GitLab CI — gerbang sebelum apa pun dianggap beres
#
#  Pengganti .github/workflows/ci.yml. GitLab TIDAK membaca berkas GitHub Actions
#  sama sekali, jadi tanpa berkas ini setiap push ke GitLab tak diperiksa siapa
#  pun — dan tanpa berkas ini pula GitLab menyalakan Auto DevOps, yang mencoba
#  menebak cara membangun dan men-deploy project lalu gagal.
#
#  Isinya sengaja SAMA dengan versi GitHub: dua penjaga yang sama, urutan yang
#  sama. Pindah rumah bukan saat yang tepat untuk sekalian mengubah aturan.
#
#  Selama masa pindahan, .github/workflows/ci.yml tetap dipertahankan karena
#  GitHub masih jadi sumber deploy Vercel. Hapus keduanya bersamaan nanti,
#  jangan salah satunya.
# =============================================================================

# Image ini hanya berlaku di runner ber-executor Docker. Runner shell
# mengabaikannya diam-diam dan memakai apa pun yang terpasang di mesinnya.
image: node:20

# Pipeline berjalan untuk tiap push ke branch mana pun, dan untuk merge request.
# Kalau sebuah branch sedang punya merge request terbuka, yang jalan pipeline
# merge request-nya saja — tanpa aturan ini, satu push memicu DUA pipeline yang
# identik, menghabiskan runner bersama yang dipakai project lain juga.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test

tes:
  stage: test

  # Instance ini punya dua runner bersama, dan yang mengambil job tanpa label
  # adalah #11 "self-shell-runner" — executor SHELL yang berjalan langsung di
  # server GitLab dan tak punya Node. Jalan pertama gagal dalam dua detik di
  # sana: `npm: command not found`, sebelum satu baris pun kode tersentuh.
  #
  # Label ini mengarahkan job ke #9 "GLOBAL RUNNER FOR GITLAB SELFHOSTED".
  tags:
    - self-runner

  # Unduhan npm disimpan antar-jalan, dikunci pada package.json — BUKAN pada
  # package-lock.json, yang memang tak ada di repo (lihat catatan di bawah).
  cache:
    key:
      files:
        - package.json
    paths:
      - .npm/

  script:
    # `npm install`, BUKAN `npm ci` — dan ini disengaja.
    #
    # `npm ci` menuntut package-lock.json, dan berkas itu SENGAJA dikeluarkan
    # dari git di commit 73de6f0: ia membuat build Vercel crash dengan
    # FUNCTION_INVOCATION_FAILED. Karena itulah workflow GitHub yang asli memakai
    # `npm install`.
    #
    # Berkas ini pernah "diperbaiki" jadi `npm ci` tanpa tahu sejarah itu, dan
    # job langsung gagal dengan EUSAGE. Jangan ulangi. Pertanyaan lockfile baru
    # layak dibuka lagi setelah aplikasinya lepas dari Vercel.
    - npm install --cache .npm --prefer-offline --no-audit --no-fund

    # Penjaga 1: salinan tangan harus identik dengan aslinya.
    #
    # test/gas.test.js membaca gas/Index.html, BUKAN public/index.html. Kalau
    # salinannya tertinggal, 1.619 assertion di sana menguji kode yang sudah tak
    # ada lagi — dan melaporkan hijau. Penjaga ini tetap perlu meski Apps Script
    # sudah tak dipakai, karena yang dijaganya adalah kejujuran tesnya.
    - |
      if ! diff -q public/index.html gas/Index.html > /dev/null; then
        echo "gas/Index.html tertinggal dari public/index.html."
        echo ""
        echo "gas/Index.html adalah salinan tangan dari public/index.html."
        echo "Perbaiki dengan satu perintah, lalu commit ulang:"
        echo ""
        echo "    cp public/index.html gas/Index.html"
        echo ""
        echo "Selisihnya:"
        diff public/index.html gas/Index.html | head -40
        exit 1
      fi
      echo "Sinkron."

    # Penjaga 2: seluruh assertion lulus.
    - npm test
